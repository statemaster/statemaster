[server]
# Wire-protocol listener. Clients connect here with TLS.
# Port 7632 = "SMDB" on a phone keypad.
listen_addr = "0.0.0.0:7632"

# HTTP endpoint for Prometheus metrics (/metrics) and health probes
# (/healthz for liveness, /readyz for readiness).
metrics_addr = "0.0.0.0:7633"

[storage]
# Directory where the database file is stored.
data_dir = "/var/lib/statemaster/data"

[logging]
# Log level: "trace" | "debug" | "info" | "warn" | "error"
# Can be overridden with the SMDB_LOG_LEVEL env var or --log-level flag.
level = "info"

# Log format: "json" (structured, for log aggregators) | "text" (human-readable)
format = "json"

[dispatcher]
# How often the dispatcher drains the transition log and pushes change records
# to subscribers, in milliseconds. Lower values reduce change-stream lag at
# the cost of more frequent storage reads.
interval_ms = 100

# [tls]
# PEM-encoded server certificate chain and private key. If omitted, the daemon
# generates a self-signed certificate at startup (fine for dev, not for prod).
# cert_path = "/etc/statemaster/cert.pem"
# key_path  = "/etc/statemaster/key.pem"

# [auth]
# Bearer tokens accepted in the Auth handshake. When no tokens are configured
# the server accepts any token (dev mode). The SMDB_AUTH_TOKENS env var
# (comma-separated) takes precedence over this list. Never commit real tokens.
# tokens = ["changeme"]
