[workspace]
resolver = "2"
members = [
    "crates/smdb-core",
    "crates/smdb-proto",
    "crates/smdb-storage",
    "crates/smdb-engine",
    "crates/smdb-wire",
    "crates/smdb-sdk",
    "crates/smdbd",
    "crates/smdbctl",
    "crates/smash",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["StateMaster Team"]
license = "AGPL-3.0"
repository = "https://github.com/statemaster/statemaster"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Storage
redb = "2.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TUI for smash
rustyline = "15"

# Metrics
prometheus = "0.13"

# HTTP for metrics/health
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Bytes
bytes = "1.9"

# Testing
tempfile = "3.10"

# Config
toml = "0.8"

# Futures
futures = "0.3"

# Parking lot for synchronization
parking_lot = "0.12"

# Rand for jitter
rand = "0.8"

# rcgen for self-signed certs in dev
rcgen = "0.13"

# webpki-roots for TLS
webpki-roots = "0.26"
